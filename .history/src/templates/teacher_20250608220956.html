{% extends 'home.html' %}
{% block content %}
<style>
    .btn-teacher {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        border: none;
        padding: 1rem 2rem;
        border-radius: 0.75rem;
        font-weight: 600;
        transition: all 0.2s ease;
        color: white;
        width: 100%;
        max-width: 400px;
        margin-top: 1rem;
    }
    .btn-teacher:hover {
        background: linear-gradient(135deg, #60a5fa, #3b82f6);
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
    }
    .navbar {
        background: #2563eb !important;
        box-shadow: 0 2px 8px rgba(59,130,246,0.08);
        margin-bottom: 0;
    }
    .navbar .nav-link, .navbar .navbar-brand {
        color: #fff !important;
        font-weight: 600;
        font-size: 1.1rem;
        letter-spacing: 0.02em;
    }
    .navbar .nav-link.active, .navbar .nav-link:focus, .navbar .nav-link:hover {
        color: #10b981 !important;
        background: none !important;
    }
    .navbar {
        border-radius: 0 0 0.5rem 0.5rem;
    }
    .container {
        margin-top: 2rem;
    }
</style>
<div class="container mt-5">
    <h2 class="text-center mb-4">Teacher Panel</h2>
    {% if message %}
        <div class="alert alert-info text-center">{{ message }}</div>
    {% endif %}
    <form method="POST" class="mb-4">
        <div class="row g-3 align-items-center mb-3">
            <div class="col-auto">
                <input type="radio" id="delete_day" name="action" value="delete_day" required>
            </div>
            <div class="col-auto">
                <label for="day" class="form-label">Delete Attendance for Day (MM_DD_YY):</label>
            </div>
            <div class="col-auto">
                <input type="text" class="form-control" id="day" name="day" placeholder="e.g. 06_08_25">
            </div>
        </div>
        <div class="row g-3 align-items-center mb-3">
            <div class="col-auto">
                <input type="radio" id="delete_student" name="action" value="delete_student">
            </div>
            <div class="col-auto">
                <label for="student_id" class="form-label">Delete Student by User ID:</label>
            </div>
            <div class="col-auto">
                <input type="text" class="form-control" id="student_id" name="student_id" placeholder="User ID">
            </div>
        </div>
        <div class="row g-3 align-items-center mb-3">
            <div class="col-auto">
                <input type="radio" id="delete_all" name="action" value="delete_all">
            </div>
            <div class="col-auto">
                <label class="form-label">Delete All Attendance Data</label>
            </div>
        </div>
        <button type="submit" class="btn btn-teacher">Execute</button>
    </form>
</div>
{% endblock %}
